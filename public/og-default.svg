  <line x1="0" y1="315" x2="1200" y2="315" stroke="#e5e1da" stroke-width="0.5"/>
  <line x1="0" y1="472" x2="1200" y2="472" stroke="#e5e1da" stroke-width="0.5"/>
  <!-- Ink drop icon - large -->
